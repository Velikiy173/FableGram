name: Build FableGram APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FableGram
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: |
          git clone --filter=blob:none https://github.com/TelegramMessenger/Telegram.git telegram-source
          git -C telegram-source checkout 21f7d109da6ab3506c9e9577f98c6a38771ab335
          git -C telegram-source submodule update --init --recursive --depth 1

      - name: Copy FableGram files
        run: |
          cp TMessagesProj/src/main/java/org/telegram/ui/FableGramDemoActivity.java telegram-source/TMessagesProj/src/main/java/org/telegram/ui/
          cp TMessagesProj/src/main/java/org/telegram/ui/IntroActivity.java telegram-source/TMessagesProj/src/main/java/org/telegram/ui/
          cp TMessagesProj/src/main/AndroidManifest.xml telegram-source/TMessagesProj/src/main/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Apply FableGram branding
        working-directory: telegram-source
        run: |
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=com.fablegram.messenger/' gradle.properties
          sed -i 's/org.telegram.messenger/com.fablegram.messenger/g' TMessagesProj_App/google-services.json
          sed -i 's|<string name="AppName">[^<]*</string>|<string name="AppName">FableGram</string>|' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppNameBeta">[^<]*</string>|<string name="AppNameBeta">FableGram Beta</string>|' TMessagesProj/src/main/res/values/strings.xml

      - name: Build APK
        working-directory: telegram-source
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --max-workers=2; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            echo "Build failed. Waiting before retry..."
            sleep $((attempt * 30))
          done

          APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FableGram-APK
          path: telegram-source/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          compression-level: 0
