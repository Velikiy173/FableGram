name: Build FableGram APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FableGram
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: |
          git clone --filter=blob:none https://github.com/TelegramMessenger/Telegram.git telegram-source
          git -C telegram-source checkout 21f7d109da6ab3506c9e9577f98c6a38771ab335
          git -C telegram-source submodule update --init --recursive --depth 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Apply FableGram branding
        working-directory: telegram-source
        run: |
          sed -i 's/^APP_PACKAGE=.*/APP_PACKAGE=com.fablegram.messenger/' gradle.properties
          sed -i 's|<string name="AppName">[^<]*</string>|<string name="AppName">FableGram</string>|' TMessagesProj/src/main/res/values/strings.xml
          sed -i 's|<string name="AppNameBeta">[^<]*</string>|<string name="AppNameBeta">FableGram Beta</string>|' TMessagesProj/src/main/res/values/strings.xml

      - name: Build APK
        working-directory: telegram-source
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -x :TMessagesProj_App:processAfatDebugGoogleServices --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FableGram-APK
          path: telegram-source/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
